[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-archive"
version = "0.2.0"
description = "Archive original WeChat articles and paginate public-account history with a local login."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "bubugamer"}]
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "markdownify>=1,<2", "qrcode[pil]>=8,<9"]

[project.optional-dependencies]
login = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1"]

[project.scripts]
wechat-archive = "wechat_archive.cli:main"

[project.urls]
Repository = "https://github.com/bubugamer/wechat-article-archive"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_archive = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
